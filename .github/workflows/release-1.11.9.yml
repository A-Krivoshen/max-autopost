name: release-1.11.9

# Retired. The previous job patched sources and could push to main.
# Publishing 1.12.0 is .github/workflows/release-1.12.0.yml and only after that code is on main.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse
        run: |
          echo "Release 1.11.9 is retired. This workflow no longer patches files and no longer pushes to main."
          echo "After 1.12.0 is on main, run the release-1.12.0 workflow."
          exit 1
