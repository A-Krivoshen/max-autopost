<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">MAX Autopost — автопостинг из WordPress в MAX</title>
  <desc id="desc">WordPress-плагин отправляет записи в MAX: картинка, текст и кнопка, очередь WP-Cron и несколько каналов.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A0E17"/>
      <stop offset="55%" stop-color="#10172A"/>
      <stop offset="100%" stop-color="#15112A"/>
    </linearGradient>
    <linearGradient id="accentGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6D5EF7" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#3ECF8E" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A2238"/>
      <stop offset="100%" stop-color="#141B2E"/>
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#8B93A7"/>
    </marker>
  </defs>

  <!-- Canvas -->
  <rect width="1200" height="380" rx="28" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="378" rx="27" fill="none" stroke="#2A3348" stroke-width="1"/>

  <!-- Soft accent wash -->
  <ellipse cx="980" cy="70" rx="220" ry="120" fill="#6D5EF7" opacity="0.12"/>
  <ellipse cx="1080" cy="300" rx="180" ry="100" fill="#3ECF8E" opacity="0.08"/>

  <!-- Left title block -->
  <g transform="translate(56 48)">
    <rect x="0" y="0" width="168" height="28" rx="14" fill="#1B2340" stroke="#3A4570" stroke-width="1"/>
    <circle cx="16" cy="14" r="5" fill="#6D5EF7"/>
    <text x="30" y="19" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" font-weight="600" fill="#C5CCE0" letter-spacing="0.6">WORDPRESS PLUGIN</text>

    <text x="0" y="88" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="54" font-weight="700" fill="#F4F6FB">MAX Autopost</text>
    <text x="0" y="128" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="22" fill="#A8B0C7">Free · v1.11.7</text>

    <text x="0" y="180" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="22" fill="#E8ECF6">Автопостинг записей WordPress</text>
    <text x="0" y="210" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="22" fill="#E8ECF6">в MAX: картинка + текст + кнопка</text>

    <text x="0" y="258" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15" fill="#8B93A7">multi-chat · WP-Cron queue · GitHub updates</text>

    <!-- Meta chips -->
    <g transform="translate(0 286)">
      <rect x="0" y="0" width="92" height="30" rx="8" fill="#1B2340" stroke="#354063" stroke-width="1"/>
      <text x="46" y="20" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#B8C0D6">PHP 8+</text>

      <rect x="102" y="0" width="100" height="30" rx="8" fill="#1B2340" stroke="#354063" stroke-width="1"/>
      <text x="152" y="20" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#B8C0D6">WP 6.0+</text>

      <rect x="212" y="0" width="72" height="30" rx="8" fill="#1B2340" stroke="#354063" stroke-width="1"/>
      <text x="248" y="20" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#B8C0D6">MIT</text>
    </g>
  </g>

  <!-- Right proof: pipeline -->
  <g transform="translate(620 52)">
    <!-- Pipeline track -->
    <rect x="0" y="0" width="524" height="276" rx="20" fill="url(#card)" stroke="#2C3654" stroke-width="1"/>

    <text x="24" y="36" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#8B93A7" letter-spacing="1">PIPELINE</text>

    <!-- Step 1: WordPress -->
    <g transform="translate(24 56)">
      <rect width="140" height="88" rx="14" fill="#0F1524" stroke="#3D4A6E" stroke-width="1.5"/>
      <rect x="14" y="16" width="28" height="28" rx="6" fill="#21759B"/>
      <text x="50" y="28" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15" font-weight="700" fill="#F4F6FB">WordPress</text>
      <text x="50" y="48" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" fill="#8B93A7">publish</text>
      <text x="14" y="72" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" fill="#6D5EF7">post → queue</text>
    </g>

    <!-- Arrow 1 -->
    <path d="M174 100 H214" stroke="#8B93A7" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Step 2: Queue -->
    <g transform="translate(224 56)">
      <rect width="140" height="88" rx="14" fill="#0F1524" stroke="#3D4A6E" stroke-width="1.5"/>
      <circle cx="28" cy="30" r="10" fill="none" stroke="#F5A524" stroke-width="2.5"/>
      <path d="M28 24 V30 H33" stroke="#F5A524" stroke-width="2" stroke-linecap="round"/>
      <text x="48" y="28" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15" font-weight="700" fill="#F4F6FB">Очередь</text>
      <text x="48" y="48" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" fill="#8B93A7">WP-Cron</text>
      <text x="14" y="72" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" fill="#F5A524">retry · lock</text>
    </g>

    <!-- Arrow 2 -->
    <path d="M374 100 H414" stroke="#8B93A7" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Step 3: MAX -->
    <g transform="translate(424 56)">
      <rect width="76" height="88" rx="14" fill="#0F1524" stroke="#6D5EF7" stroke-width="1.5"/>
      <rect x="18" y="18" width="40" height="40" rx="12" fill="#6D5EF7"/>
      <text x="38" y="44" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">M</text>
      <text x="38" y="76" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" font-weight="600" fill="#C5CCE0">MAX</text>
    </g>

    <!-- Message card -->
    <g transform="translate(24 164)">
      <rect width="476" height="88" rx="14" fill="#0C121F" stroke="#2C3654" stroke-width="1"/>
      <text x="16" y="26" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" fill="#8B93A7" letter-spacing="0.8">ONE MESSAGE</text>

      <!-- IMAGE chip -->
      <rect x="16" y="40" width="120" height="32" rx="8" fill="#1B2340" stroke="#3A4570" stroke-width="1"/>
      <rect x="28" y="48" width="16" height="16" rx="3" fill="#6D5EF7" opacity="0.85"/>
      <text x="52" y="61" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" font-weight="600" fill="#E8ECF6">IMAGE</text>

      <text x="148" y="61" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16" fill="#5A647C">+</text>

      <!-- TEXT chip -->
      <rect x="168" y="40" width="120" height="32" rx="8" fill="#1B2340" stroke="#3A4570" stroke-width="1"/>
      <rect x="180" y="50" width="18" height="3" rx="1.5" fill="#3ECF8E"/>
      <rect x="180" y="57" width="24" height="3" rx="1.5" fill="#3ECF8E" opacity="0.6"/>
      <rect x="180" y="64" width="14" height="3" rx="1.5" fill="#3ECF8E" opacity="0.35"/>
      <text x="212" y="61" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" font-weight="600" fill="#E8ECF6">TEXT</text>

      <text x="300" y="61" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16" fill="#5A647C">+</text>

      <!-- BUTTON chip -->
      <rect x="320" y="40" width="136" height="32" rx="8" fill="#1B2340" stroke="#3A4570" stroke-width="1"/>
      <rect x="332" y="48" width="40" height="16" rx="4" fill="#3ECF8E"/>
      <text x="380" y="61" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" font-weight="600" fill="#E8ECF6">BUTTON</text>
    </g>
  </g>
</svg>
