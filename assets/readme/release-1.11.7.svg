<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-labelledby="title desc">
  <title id="title">MAX Autopost 1.11.7 — fix channel-notify</title>
  <desc id="desc">Каналы MAX отклоняли silent notify=false с ошибкой channel-notify. В 1.11.7 — авто-retry без silent и понятное сообщение об ошибке.</desc>

  <defs>
    <linearGradient id="rbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A0E17"/>
      <stop offset="100%" stop-color="#12182A"/>
    </linearGradient>
    <linearGradient id="fix" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6D5EF7"/>
      <stop offset="100%" stop-color="#3ECF8E"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="220" rx="28" fill="url(#rbg)"/>
  <rect x="1" y="1" width="1198" height="218" rx="27" fill="none" stroke="#2A3348" stroke-width="1"/>
  <rect x="0" y="0" width="8" height="220" rx="4" fill="url(#fix)"/>

  <!-- Badge -->
  <g transform="translate(48 36)">
    <rect width="118" height="28" rx="14" fill="#1B2340" stroke="#3ECF8E" stroke-width="1"/>
    <circle cx="16" cy="14" r="5" fill="#3ECF8E"/>
    <text x="30" y="19" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" font-weight="700" fill="#C8F0DC" letter-spacing="0.5">v1.11.7 FIX</text>
  </g>

  <text x="48" y="100" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="28" font-weight="700" fill="#F4F6FB">Каналы MAX + notify=false</text>
  <text x="48" y="136" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="18" fill="#A8B0C7">API отвечал errors.send-message.channel-notify → тест «0/1 target»</text>
  <text x="48" y="168" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="18" fill="#E8ECF6">Авто-retry без silent · понятный notice · подсказка в настройках</text>

  <!-- Right mini flow -->
  <g transform="translate(780 48)">
    <rect width="372" height="124" rx="16" fill="#141B2E" stroke="#2C3654" stroke-width="1"/>
    <text x="20" y="32" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" fill="#8B93A7" letter-spacing="1">RETRY PATH</text>

    <rect x="20" y="48" width="140" height="52" rx="10" fill="#0F1524" stroke="#F5A524" stroke-width="1.5"/>
    <text x="90" y="70" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" fill="#F5A524">notify=false</text>
    <text x="90" y="88" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" fill="#8B93A7">channel 400</text>

    <path d="M168 74 H198" stroke="#8B93A7" stroke-width="2"/>
    <polygon points="198,70 206,74 198,78" fill="#8B93A7"/>

    <rect x="212" y="48" width="140" height="52" rx="10" fill="#0F1524" stroke="#3ECF8E" stroke-width="1.5"/>
    <text x="282" y="70" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" fill="#3ECF8E">omit notify</text>
    <text x="282" y="88" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" fill="#8B93A7">sent · OK</text>
  </g>
</svg>
